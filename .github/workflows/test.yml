name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Installa Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q Godot_*.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          rm Godot_*.zip

      - name: Aggiungi Godot al PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Importa le risorse
        run: godot --headless --path . --import

      - name: Test end-to-end (63 controlli)
        run: timeout 300 godot --headless --path . -- --autotest

      - name: Test morte e riavvio
        run: timeout 300 godot --headless --path . -- --autotest --death

      - name: Test bottoni UI
        run: timeout 300 godot --headless --path . -- --autotest --ui

      - name: Test generatore di NPC
        run: timeout 300 godot --headless --path . -- --autotest --npc

      - name: Test del creatore di NPC nell'editor
        run: |
          # timeout: se il plugin non si carica l'editor resterebbe aperto fino al limite del job
          NPC_CREATOR_SELFTEST=1 timeout 300 godot --headless --editor --path . 2>&1 | tee selftest.log
          grep -q "RISULTATO CREATORE NPC: .*, 0 fail" selftest.log

      - name: Test del livello della guida all'editor
        run: timeout 300 godot --headless --path . -- --level=res://levels/guida/guida.tscn --autotest --guida

      - name: Validazione dei livelli
        run: |
          for f in levels/*/*.tscn; do
            godot --headless --path . -- --validate --level="res://$f"
          done

      - name: I livelli si aprono nell'editor senza errori
        run: |
          fail=0
          for f in levels/*/*.tscn; do
            echo "== editor: $f"
            out=$(godot --headless --editor --path . "res://$f" --quit-after 400 2>&1)
            if echo "$out" | grep -E "SCRIPT ERROR|Parse Error|ERROR:"; then fail=1; fi
          done
          exit $fail
